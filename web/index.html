<!DOCTYPE html>
<html>
<head>
  <!-- Base href (obrigatório pro Flutter) -->
  <base href="/">

  <!-- Charset e viewport -->
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Afinador Vocal">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon.png">

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Meta tags básicas -->
  <title>Afinador Vocal</title>
  <meta name="description" content="Afinador vocal profissional com síntese de vogais, escalas e exercícios para cantores.">
  <meta name="theme-color" content="#6C63FF">

  <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
  <meta property="og:title" content="Afinador Vocal">
  <meta property="og:description" content="Afinador vocal profissional com síntese de vogais, escalas e exercícios para cantores.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://afinadorvocal.com.br/">
  <meta property="og:image" content="https://afinadorvocal.com.br/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="Afinador Vocal">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Afinador Vocal">
  <meta name="twitter:description" content="Afinador vocal profissional com síntese de vogais, escalas e exercícios para cantores.">
  <meta name="twitter:image" content="https://afinadorvocal.com.br/og-image.png">

  <!-- Cache busting -->
  <meta http-equiv="Cache-Control" content="no-store">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
